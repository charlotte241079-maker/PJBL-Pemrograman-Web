[package]
name = "charlotte241079-maker/pjbl-pemrograman-web"
version = "0.1.0"
description = "UMKMHub - Sistem Manajemen Usaha"

[dependencies]
"php/php" = "^8.3"

[fs]
"/app" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-S", "0.0.0.0:8080", "-t", "/app/public"]

[[capability]]
name = "http-server"